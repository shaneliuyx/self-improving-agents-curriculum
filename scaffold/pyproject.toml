[project]
name = "self-improving-agent-lab"
version = "0.1.0"
description = "Runnable scaffold for building self-improving agents on local oMLX or Claude MAX via VibeProxy."
requires-python = ">=3.10"
dependencies = [
    # The lab's self-improving agent is BUILT ON agentkit (memory, agent loop,
    # gates, sandbox/net_guard, evolve, skills, + the SelfImprovingAgent facade).
    "agentkit @ git+https://github.com/shaneliuyx/agentkit",
    "openai>=1.30",
    "numpy>=1.24",
]

[project.optional-dependencies]
rich = ["rich>=13.0"]
# Optional "graduation" track (see frameworks/). Not needed for the core lab.
frameworks = ["mem0ai>=0.1", "pydantic-ai>=0.0.14", "claude-agent-sdk>=0.2", "anyio>=4.0", "deepagents>=0.1", "langchain-openai>=0.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The scaffold is a flat collection of small packages plus a top-level config module.
# Declaring them here lets `pip install -e .` put the repo root on sys.path so
# `from backends.adapter import ...` and `from config import settings` resolve
# both at runtime and for type checkers.
[tool.setuptools]
# `lab_agent` is the canonical "lab agent on agentkit" entry point (top-level
# module, like `config`), so `pip install -e .` exposes `import lab_agent`.
py-modules = ["config", "lab_agent"]
packages = [
    "backends",
    "agent",
    "memory",
    "reflection",
    "skills",
    "verification",
    "evolve",
    "evals",
    "frameworks",
]
